<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ECEAE6">
<title>Church Music Planner</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#ECEAE6;--bg2:#FAFAF8;--bg3:#F2F0EC;--bg4:#E4E2DE;
  --text:#1A1A2E;--text2:#4A4A6A;--text3:#7A7A96;
  --accent:#B8860B;--accent2:#3B5998;--accent3:#5A78B0;
  --green:#3A6B52;--red:#C0392B;--orange:#B8860B;--purple:#6B4A8A;
  --border:#C8C6C0;--border2:#DAD8D2;--border3:#BBB9B3;
  --shadow:rgba(26,26,46,0.08);
  --card-bg:#FAFAF8;--chip-bg:#FAFAF8;--input-bg:#F2F0EC;
  --tag-bg:#E0E4F0;--tag-c:#3B5998;
  --cat-bg:#FFF3DE;--cat-c:#B8860B;
  --note-bg:#FFF3DE;--note-c:#B8860B;
  --use-bg:#EDE8F5;--use-c:#6B4A8A;
  --inst-bg:#E0E4EE;--inst-c:#3B5998;
  --script-bg:#E0E4EE;--script-c:#3B5998;
  --ghost-bg:#DDDBD7;--ghost-c:#4A4A6A;
  --green-bg:#E0F0E4;--green-c:#3A6B52;
  --orange-bg:#FFF3DE;--red-bg:#FDEAEA;
  --overlay:rgba(26,26,46,0.5);--bar-bg:#D6D4CE;
  --tab-bg:#FAFAF8;--tab-border:#C8C6C0;
  --preview-bg:#FAFAF8;--hover-bg:#E8E6E2;
  --avail-ok:#3A6B52;--avail-tent:#B8860B;--avail-no:#C0392B;
  --plan-border:#DAD8D2;
}
[data-theme="dark"]{
  --bg:#1C1C1E;--bg2:#2A2A2E;--bg3:#333338;--bg4:#3A3A40;
  --text:#E0DED8;--text2:#9A98A8;--text3:#6A6878;
  --accent:#D4A530;--accent2:#6B8AC4;--accent3:#8AA4D8;
  --green:#5AAE6A;--red:#E05A4F;--orange:#D4A530;--purple:#8B7ABF;
  --border:#3A3A42;--border2:#32323A;--border3:#3A3A42;
  --shadow:rgba(0,0,0,0.35);
  --card-bg:#2A2A2E;--chip-bg:#333338;--input-bg:#333338;
  --tag-bg:#282840;--tag-c:#8AA4D8;
  --cat-bg:#2A2410;--cat-c:#D4A530;
  --note-bg:#2A2410;--note-c:#D4A530;
  --use-bg:#2A2238;--use-c:#8B7ABF;
  --inst-bg:#282840;--inst-c:#8AA4D8;
  --script-bg:#282840;--script-c:#8AA4D8;
  --ghost-bg:#3A3A40;--ghost-c:#9A98A8;
  --green-bg:#1A3020;--green-c:#5AAE6A;
  --orange-bg:#2A2410;--red-bg:#2A1818;
  --overlay:rgba(0,0,0,0.7);--bar-bg:#3A3A42;
  --tab-bg:#1C1C1E;--tab-border:#3A3A42;
  --preview-bg:#2A2A2E;--hover-bg:#3A3A40;
  --avail-ok:#5AAE6A;--avail-tent:#D4A530;--avail-no:#E05A4F;
  --plan-border:#3A3A42;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;transition:background .25s,color .25s}
#app{max-width:500px;margin:0 auto;min-height:100vh;min-height:100dvh;padding-bottom:70px}
.header{position:sticky;top:0;z-index:100;background:var(--bg);padding:16px 16px 0}
.header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.logo{font-family:'DM Serif Display',serif;font-size:22px;color:var(--accent);letter-spacing:-0.3px}
.count{font-size:13px;color:var(--text2);font-weight:500}
.theme-toggle{background:none;border:1px solid var(--border);border-radius:8px;padding:4px 8px;
  font-size:16px;cursor:pointer;line-height:1;color:var(--text2)}
.search-wrap{position:relative;margin-bottom:12px}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:15px;pointer-events:none}
.search{width:100%;padding:10px 36px;border:1.5px solid var(--border);border-radius:10px;
  background:var(--card-bg);font-family:'DM Sans',sans-serif;font-size:16px;color:var(--text);outline:none}
.search:focus{border-color:var(--accent)}
.search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);
  background:var(--ghost-bg);border:none;border-radius:50%;width:22px;height:22px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);font-size:13px}
.filters{display:flex;gap:8px;padding-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;-ms-overflow-style:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);
  background:var(--chip-bg);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;
  color:var(--text2);cursor:pointer;white-space:nowrap;transition:all 0.15s}
.chip.active{border-color:var(--accent);background:var(--accent);color:#fff}
.sort{font-size:16px;color:var(--text2);background:var(--ghost-bg);border:1px solid var(--border);
  border-radius:6px;padding:4px 6px;font-family:'DM Sans',sans-serif;cursor:pointer}
.song-list{padding:0 16px}
.card{background:var(--card-bg);border-radius:10px;padding:14px 16px;margin-bottom:8px;
  box-shadow:0 1px 3px var(--shadow);cursor:pointer;transition:box-shadow 0.15s;
  border-left:3px solid transparent}
.card.has-scripture{border-left-color:var(--accent)}
.card-header{display:flex;align-items:flex-start;gap:12px}
.hymn-num{font-family:'DM Serif Display',serif;font-size:20px;color:var(--accent);
  line-height:1;min-width:32px}
.card-body{flex:1;min-width:0}
.card-title{font-size:15px;font-weight:600;color:var(--text);line-height:1.3}
.card-sub{font-size:12px;color:var(--text2);margin-top:2px}
.card-badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600}
.badge-cat{background:var(--cat-bg);color:var(--cat-c)}
.badge-tag{background:var(--tag-bg);color:var(--tag-c)}
.badge-note{background:var(--note-bg);color:var(--note-c)}
.badge-use{background:var(--use-bg);color:var(--use-c)}
.detail{margin-top:12px;padding-top:12px;border-top:1px solid var(--border2)}
.detail-row{display:flex;margin-bottom:6px;font-size:13px}
.detail-label{color:var(--text3);min-width:70px;font-weight:500}
.detail-value{color:var(--text);flex:1}
.key-tag{display:inline-block;background:var(--cat-bg);color:var(--cat-c);padding:1px 8px;
  border-radius:4px;font-size:11px;font-weight:600;margin-right:4px}
.scripture-tag{display:inline-block;background:var(--script-bg);color:var(--script-c);padding:1px 8px;
  border-radius:4px;font-size:11px;font-weight:500}
.section-label{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;
  letter-spacing:0.5px;margin-bottom:8px}
.cat-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.cat-btn{padding:5px 12px;border-radius:16px;border:1.5px solid var(--border3);background:var(--card-bg);
  font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer}
.cat-btn.active{border-color:var(--accent);background:var(--accent);color:#fff}
.tag-chip{display:inline-flex;align-items:center;gap:4px;background:var(--tag-bg);color:var(--tag-c);
  padding:3px 10px;border-radius:12px;font-size:12px;font-weight:500;margin:0 4px 4px 0}
.tag-remove{cursor:pointer;opacity:0.6;font-size:11px}
.tag-suggest{padding:4px 10px;border-radius:12px;border:1px dashed var(--border);background:var(--bg3);
  font-size:12px;color:var(--text2);cursor:pointer;margin:0 4px 4px 0}
.input{width:100%;padding:7px 10px;border:1.5px solid var(--border);border-radius:8px;
  background:var(--input-bg);font-family:'DM Sans',sans-serif;font-size:16px;color:var(--text);outline:none}
.input:focus{border-color:var(--accent)}
.btn{padding:5px 12px;border-radius:6px;border:none;font-family:'DM Sans',sans-serif;
  font-size:12px;font-weight:600;cursor:pointer;transition:all 0.15s}
.btn-copper{background:var(--accent);color:#fff}
.btn-navy{background:var(--accent2);color:#fff}
.btn-ghost{background:var(--ghost-bg);color:var(--ghost-c)}
.btn-green{background:var(--green-bg);color:var(--green-c)}
.note-item{display:flex;align-items:flex-start;justify-content:space-between;
  padding:8px 10px;background:var(--note-bg);border-radius:6px;margin-bottom:3px;font-size:13px}
.note-remove{color:var(--text3);cursor:pointer;font-size:11px;margin-left:8px;flex-shrink:0}
.usage-item{display:flex;align-items:center;justify-content:space-between;
  padding:6px 10px;background:var(--use-bg);border-radius:6px;margin-bottom:3px;font-size:13px}
.dash-card{background:var(--card-bg);border-radius:10px;padding:16px;
  box-shadow:0 1px 3px var(--shadow);margin-bottom:12px}
.stats-row{display:flex;gap:8px;margin-bottom:12px}
.stat-box{flex:1;background:var(--card-bg);border-radius:10px;padding:14px 12px;
  box-shadow:0 1px 3px var(--shadow);text-align:center}
.stat-value{font-family:'DM Serif Display',serif;font-size:26px;line-height:1}
.stat-label{font-size:11px;color:var(--text2);margin-top:4px;font-weight:500}
.mini-row{display:flex;align-items:center;gap:10px;padding:10px 12px;
  background:var(--bg3);border-radius:8px;margin-bottom:4px;cursor:pointer}
.mini-num{font-family:'DM Serif Display',serif;font-size:16px;color:var(--accent);min-width:30px}
.mini-title{font-size:14px;font-weight:600;color:var(--text);line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-sub{font-size:11.5px;color:var(--text2);margin-top:1px}
.mu-bar-bg{flex:1;background:var(--bar-bg);border-radius:3px;height:6px;overflow:hidden}
.mu-bar{height:100%;background:var(--accent);border-radius:3px}
.tag-cloud{display:flex;flex-wrap:wrap;gap:6px}
.tab-bar{position:fixed;bottom:0;left:0;right:0;z-index:200;background:var(--tab-bg);
  border-top:1px solid var(--tab-border);display:flex;justify-content:center;
  padding-bottom:env(safe-area-inset-bottom,8px)}
.tab-bar-inner{display:flex;max-width:500px;width:100%}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:10px 0 6px;border:none;background:none;font-family:'DM Sans',sans-serif;
  cursor:pointer;color:var(--text3);transition:color 0.15s;font-size:11px}
.tab.active{color:var(--accent);font-weight:600}
.tab-icon{font-size:20px}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:300;
  background:var(--overlay);display:flex;align-items:center;justify-content:center;padding:16px}
.preview-box{background:var(--preview-bg);border-radius:12px;max-width:500px;width:100%;
  max-height:85vh;overflow:auto;box-shadow:0 8px 32px var(--shadow)}
.preview-header{padding:16px 20px;border-bottom:1px solid var(--border2);
  display:flex;justify-content:space-between;align-items:center}
.empty{text-align:center;padding:48px 24px;color:var(--text2)}
.sync{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;margin-left:8px}
.sync-saving{background:var(--orange-bg);color:var(--orange)}
.sync-saved{background:var(--green-bg);color:var(--green-c)}
.loading{display:flex;align-items:center;justify-content:center;flex-direction:column;
  gap:12px;min-height:100vh;min-height:100dvh}
.team-card{background:var(--card-bg);border-radius:10px;padding:14px 16px;margin-bottom:8px;
  box-shadow:0 1px 3px var(--shadow);border-left:3px solid var(--accent2)}
.team-card.unavailable{border-left-color:var(--text3);opacity:0.7}
.team-name{font-size:15px;font-weight:600;color:var(--text)}
.team-role{font-size:12px;color:var(--text2);margin-top:2px}
.team-instruments{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.inst-tag{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;
  background:var(--inst-bg);color:var(--inst-c)}
.avail-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.avail-dot.available{background:var(--avail-ok)}
.avail-dot.unavailable{background:var(--avail-no)}
.avail-dot.tentative{background:var(--avail-tent)}
.avail-label{font-size:12px;font-weight:500}
.avail-row{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;
  background:var(--bg3);border-radius:6px;margin-bottom:3px}
.avail-btns{display:flex;gap:4px}
.avail-btn{padding:3px 10px;border-radius:12px;border:1.5px solid var(--border3);background:var(--card-bg);
  font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;color:var(--text2);cursor:pointer}
.avail-btn.sel-available{border-color:var(--avail-ok);background:var(--green-bg);color:var(--avail-ok)}
.avail-btn.sel-tentative{border-color:var(--avail-tent);background:var(--orange-bg);color:var(--avail-tent)}
.avail-btn.sel-unavailable{border-color:var(--avail-no);background:var(--red-bg);color:var(--avail-no)}
.plan-item{background:var(--card-bg);border-radius:10px;padding:12px 14px;margin-bottom:6px;box-shadow:0 1px 4px var(--shadow);border-left:3px solid var(--plan-border)}
.plan-item.is-song{border-left-color:var(--accent)}
.plan-item.has-song{border-left-color:var(--green)}
.plan-label{font-size:12px;color:var(--text2);font-weight:500;text-transform:uppercase;letter-spacing:.3px}
.plan-song-name{font-size:15px;font-weight:600;color:var(--text);margin-top:2px}
.plan-song-sub{font-size:12px;color:var(--text2)}
.plan-search-box{margin-top:8px;position:relative}
.plan-search-input{width:100%;box-sizing:border-box;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:16px;outline:none;background:var(--input-bg);color:var(--text)}
.plan-search-input:focus{border-color:var(--accent)}
.plan-results{max-height:180px;overflow-y:auto;margin-top:4px;border:1px solid var(--border2);border-radius:8px;background:var(--card-bg)}
.plan-result-item{padding:8px 10px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border2);display:flex;gap:8px;align-items:baseline;color:var(--text)}
.plan-result-item:hover{background:var(--hover-bg)}
.plan-result-item:last-child{border-bottom:none}
.plan-quick-picks{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.plan-quick-pick{font-size:11px;padding:4px 8px;border-radius:6px;background:var(--green-bg);color:var(--green-c);cursor:pointer;border:none}
.plan-quick-pick:hover{background:var(--tag-bg)}
.plan-date-nav{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:12px}
.plan-date-nav button{background:none;border:1px solid var(--border);border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer;color:var(--accent2)}
.plan-date-nav button:hover{background:var(--hover-bg)}
.plan-date-label{font-size:16px;font-weight:600;color:var(--accent2);min-width:180px;text-align:center}
.tpl-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg3);border-radius:8px;margin-bottom:4px}
.tpl-item .tpl-icon{font-size:14px;min-width:20px;text-align:center}
.tpl-item input{flex:1;border:1px solid var(--border2);border-radius:6px;padding:5px 8px;font-size:16px;background:var(--input-bg);color:var(--text)}
.tpl-item .tpl-btns{display:flex;gap:4px}
</style>
</head>
<body>
<div id="app"></div>
<script>

// ============================================================
// THEME SYSTEM
// ============================================================
function initTheme() {
  var saved = localStorage.getItem("theme");
  if (saved) {
    document.documentElement.setAttribute("data-theme", saved);
  } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
    document.documentElement.setAttribute("data-theme", "dark");
  }
  updateThemeMeta();
}
function toggleTheme() {
  var current = document.documentElement.getAttribute("data-theme");
  var next = current === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("theme", next);
  updateThemeMeta();
  render();
}
function updateThemeMeta() {
  var dk = document.documentElement.getAttribute("data-theme") === "dark";
  document.querySelector('meta[name="theme-color"]').content = dk ? "#1C1C1E" : "#ECEAE6";
}
function isDarkMode() { return document.documentElement.getAttribute("data-theme") === "dark"; }

function parseSongData(raw) {
  return raw.trim().split("\n").map(function(line) {
    var p = line.split("|");
    return {
      hymnNumber: parseInt(p[0]), title: p[1], keys: p[2] || "", wordsBy: p[3] || "",
      musicBy: p[4] || "", year: parseInt(p[5]) || 0, tune: p[6] || "", firstLine: p[7] || "",
      scripture: p[8] || "", tags: [], category: "", notes: [], usageDates: []
    };
  });
}

const DB_NAME = "SingHymnalDB";
const DB_VERSION = 5;
const STORE_NAME = "userData";
const TEAM_STORE = "teamMembers";
const CUSTOM_SONG_STORE = "customSongs";
const PLAN_STORE = "servicePlans";
const TEMPLATE_STORE = "serviceTemplate";
const SETTINGS_STORE = "appSettings";

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME, { keyPath: "id" });
      }
      if (!db.objectStoreNames.contains(TEAM_STORE)) {
        db.createObjectStore(TEAM_STORE, { keyPath: "id" });
      }
      if (!db.objectStoreNames.contains(CUSTOM_SONG_STORE)) {
        db.createObjectStore(CUSTOM_SONG_STORE, { keyPath: "id" });
      }
      if (!db.objectStoreNames.contains(PLAN_STORE)) {
        db.createObjectStore(PLAN_STORE, { keyPath: "date" });
      }
      if (!db.objectStoreNames.contains(TEMPLATE_STORE)) {
        db.createObjectStore(TEMPLATE_STORE, { keyPath: "id" });
      }
      if (!db.objectStoreNames.contains(SETTINGS_STORE)) {
        db.createObjectStore(SETTINGS_STORE, { keyPath: "id" });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function songKey(s) { return s.isCustom ? "custom-" + s.customId : s.hymnNumber + "-" + s.tune; }
function displayKeys(s) { return s.editedKeys || s.keys || ""; }

async function loadAllUserData() {
  try {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, "readonly");
      const store = tx.objectStore(STORE_NAME);
      const req = store.getAll();
      req.onsuccess = () => {
        const map = {};
        req.result.forEach(r => { map[r.id] = r; });
        resolve(map);
      };
      req.onerror = () => reject(req.error);
    });
  } catch(e) { console.error("DB load error:", e); return {}; }
}

async function saveSong(song) {
  try {
    if (song.isCustom) {
      // For custom songs, save the full song back to customSongs store
      var raw = customSongsRaw.find(function(c) { return c.id === song.customId; });
      if (raw) {
        raw.tags = song.tags;
        raw.category = song.category;
        raw.notes = song.notes;
        raw.usageDates = song.usageDates;
        raw.title = song.title;
        raw.hymnNumber = song.hymnNumber;
        raw.keys = song.keys;
        raw.wordsBy = song.wordsBy;
        raw.musicBy = song.musicBy;
        raw.year = song.year;
        raw.tune = song.tune;
        raw.firstLine = song.firstLine;
        raw.scripture = song.scripture;
        raw.editedKeys = song.editedKeys || "";
        raw.songOrder = song.songOrder || "";
        raw.ccli = song.ccli || "";
        raw.links = song.links || [];
        await saveCustomSong(raw);
      }
    } else {
      var db = await openDB();
      return new Promise(function(resolve, reject) {
        var tx = db.transaction(STORE_NAME, "readwrite");
        var store = tx.objectStore(STORE_NAME);
        store.put({
          id: songKey(song),
          tags: song.tags,
          category: song.category,
          notes: song.notes,
          usageDates: song.usageDates,
          editedKeys: song.editedKeys || "",
          songOrder: song.songOrder || "",
          ccli: song.ccli || "",
          links: song.links || []
        });
        tx.oncomplete = function() { resolve(); };
        tx.onerror = function() { reject(tx.error); };
      });
    }
  } catch(e) { console.error("DB save error:", e); }
}

function mergeSongs(base, userData) {
  return base.map(s => {
    const saved = userData[songKey(s)];
    if (saved) {
      return { ...s, tags: saved.tags || [], category: saved.category || "",
               notes: saved.notes || [], usageDates: saved.usageDates || [],
               editedKeys: saved.editedKeys || "", songOrder: saved.songOrder || "", ccli: saved.ccli || "", links: saved.links || [] };
    }
    return { ...s };
  });
}

function filterSong(s, f) {
  if (f === "all") return true;
  if (f === "custom") return !!s.isCustom;
  if (f === "sing") return !s.isCustom;
  if (f === "classic") return s.year > 0 && s.year < 1900;
  if (f === "modern") return s.year >= 1990;
  if (f === "psalms") return s.title.toLowerCase().includes("psalm") || (s.scripture && s.scripture.toLowerCase().includes("psalm"));
  if (f === "christmas") {
    if (appSettings.activeHymnal === "bh2008") return !s.isCustom && s.hymnNumber >= 175 && s.hymnNumber <= 215;
    if (appSettings.activeHymnal === "bh1991") return !s.isCustom && s.hymnNumber >= 85 && s.hymnNumber <= 118;
    return !s.isCustom && s.hymnNumber >= 708 && s.hymnNumber <= 797;
  }
  if (f === "easter") {
    if (appSettings.activeHymnal === "bh2008") return !s.isCustom && s.hymnNumber >= 268 && s.hymnNumber <= 278;
    if (appSettings.activeHymnal === "bh1991") return !s.isCustom && s.hymnNumber >= 159 && s.hymnNumber <= 173;
    return !s.isCustom && s.hymnNumber >= 823 && s.hymnNumber <= 842;
  }
  if (f === "communion") {
    if (appSettings.activeHymnal === "bh2008") return !s.isCustom && s.hymnNumber >= 397 && s.hymnNumber <= 410;
    if (appSettings.activeHymnal === "bh1991") return !s.isCustom && s.hymnNumber >= 365 && s.hymnNumber <= 377;
    return !s.isCustom && s.hymnNumber >= 309 && s.hymnNumber <= 322;
  }
  return true;
}

function getNextSunday() {
  var d = new Date();
  var day = d.getDay();
  var diff = day === 0 ? 0 : 7 - day;
  d.setDate(d.getDate() + diff);
  var y = d.getFullYear();
  var m = String(d.getMonth() + 1).padStart(2, "0");
  var dd = String(d.getDate()).padStart(2, "0");
  return y + "-" + m + "-" + dd;
}

function formatDate(ds) {
  const d = new Date(ds + "T12:00:00");
  return d.toLocaleDateString("en-US", { weekday:"short", month:"short", day:"numeric", year:"numeric" });
}

function daysAgo(ds) {
  const now = new Date(); now.setHours(0,0,0,0);
  const then = new Date(ds + "T12:00:00"); then.setHours(0,0,0,0);
  const diff = Math.floor((now - then) / 864e5);
  if (diff < 0) return "upcoming";
  if (diff === 0) return "today";
  if (diff === 1) return "yesterday";
  if (diff < 7) return diff + "d ago";
  if (diff < 30) return Math.floor(diff/7) + "w ago";
  return Math.floor(diff/30) + "mo ago";
}

// EVENT DELEGATION (no more inline onclick!)
// ============================================================
document.addEventListener("click", function(e) {
  // If clicking inside a detail area on a non-action element (input, date picker, etc),
  // don't let it bubble up to toggleExpand or toggleMember
  if (e.target.closest(".detail") && !e.target.closest("[data-action]")) return;

  var el = e.target.closest("[data-action]");
  if (!el) return;
  var action = el.dataset.action;
  var key = el.dataset.key || "";
  var arg = el.dataset.arg || "";
  var idx = el.dataset.idx;

  // If the action is toggleExpand/toggleMember but click originated inside detail, ignore
  if ((action === "toggleExpand" || action === "toggleMember") && e.target.closest(".detail")) return;

  switch(action) {
    case "clearSearch": query = ""; render(); break;
    case "setFilter": filter = arg; render(); break;
    case "setSort": break; // handled by onchange
    case "setTab":
      tab = arg;
      if (arg === "plan" && !currentPlan) {
        planDate = planDate || getNextSunday();
        loadServicePlan(planDate).then(function(p) { currentPlan = p; render(); });
      }
      render();
      window.scrollTo(0,0);
      break;
    case "toggleExpand":
      expanded = expanded === key ? null : key;
      render();
      if (expanded) {
        var cel = document.getElementById("song-" + key);
        if (cel) setTimeout(function(){cel.scrollIntoView({behavior:"smooth",block:"start"})},50);
      }
      break;
    case "setCategory":
      var sc = findSong(key);
      if (sc) { sc.category = sc.category === arg ? "" : arg; update(sc); }
      break;
    case "addTag": doAddTag(key); break;
    case "addTagDirect":
      var st = findSong(key);
      if (st && !st.tags.includes(arg)) { st.tags.push(arg); update(st); }
      break;
    case "removeTag":
      var sr = findSong(key);
      if (sr) { sr.tags = sr.tags.filter(function(t){return t !== arg;}); update(sr); }
      break;
    case "addNote": doAddNote(key); break;
    case "removeNote":
      var sn = findSong(key);
      if (sn && idx !== undefined) { sn.notes.splice(parseInt(idx), 1); update(sn); }
      break;
    case "logSunday":
      doLogUsage(key, getNextSunday());
      break;
    case "logCustom":
      var dinp = document.getElementById("dateInput-" + key);
      if (dinp && dinp.value) doLogUsage(key, dinp.value);
      break;
    case "removeUsage":
      var su = findSong(key);
      if (su) { su.usageDates = su.usageDates.filter(function(d){return d !== arg;}); update(su); }
      break;
    case "navigateToSong": navigateToSong(key); break;
    case "handleCopy": handleCopy(); break;
    case "openPreview": previewOpen = true; render(); break;
    case "closePreview": previewOpen = false; render(); break;
    case "closeOverlay": previewOpen = false; render(); break;
    case "exportData": exportData(); break;
    case "addTeamMember": doAddTeamMember(); break;
    case "removeMember":
      if (confirm("Remove this team member?")) {
        doRemoveMember(key);
      }
      break;
    case "openTeamModal":
      teamModalOpen = true; teamEditId = key || null; render(); break;
    case "closeTeamModal":
      teamModalOpen = false; teamEditId = null; render(); break;
    case "toggleMember":
      expandedMember = expandedMember === key ? null : key;
      render();
      break;
    case "toggleRole":
      doToggleRole(key, arg); break;
    case "setAvailability": doSetAvailability(key, arg, el.dataset.date); break;
    case "addInstrument": doAddInstrument(key); break;
    case "removeInstrument":
      doRemoveInstrument(key, arg);
      break;
    case "setRole": doSetRole(key, arg); break;
    case "saveMemberName": doSaveMemberName(key); break;
    case "toggleAddSongForm": showAddSongForm = !showAddSongForm; csvImportData = null; render(); break;
    case "saveManualSong": doSaveManualSong(); break;
    case "confirmCsvImport": doConfirmCsvImport(); break;
    case "cancelCsvImport": csvImportData = null; render(); break;
    case "deleteCustomSong":
      if (confirm("Delete this custom song? This cannot be undone.")) { doDeleteCustomSong(key); }
      break;
    case "toggleKey": doToggleKey(key, arg); break;
    case "addKey": doAddKey(key); break;
    case "resetKeys": doResetKeys(key); break;
    case "saveSongOrder": doSaveSongOrder(key); break;
    case "saveCcli": doSaveCcli(key); break;
    case "addLink": doAddLink(key); break;
    case "removeLink": doRemoveLink(key, parseInt(el.dataset.idx)); break;
    // Plan actions
    case "planPrevWeek": doPlanNav(-7); break;
    case "planNextWeek": doPlanNav(7); break;
    case "togglePlanSearch":
      planSearchSlot = planSearchSlot === key ? null : key;
      planSearchQuery = "";
      render();
      if (planSearchSlot) setTimeout(function(){ var el = document.getElementById("planSearchInput"); if(el) el.focus(); }, 50);
      break;
    case "assignPlanSong": doAssignPlanSong(key, arg); break;
    case "clearPlanSlot": doClearPlanSlot(key); break;
    case "toggleTemplateEdit": doToggleTemplateEdit(); break;
    case "toggleTemplateType": doToggleTemplateType(parseInt(key)); break;
    case "moveTemplateItem": doMoveTemplateItem(parseInt(key), arg); break;
    case "removeTemplateItem": doRemoveTemplateItem(parseInt(key)); break;
    case "addTemplateItem": doAddTemplateItem(arg); break;
    case "resetTemplate":
      if (confirm("Reset template to default? Current template will be lost.")) doResetTemplate();
      break;
    case "toggleTheme": toggleTheme(); break;
    case "openPlanPreview": planPreviewOpen = true; render(); break;
    case "closePlanPreview": planPreviewOpen = false; render(); break;
    case "togglePlanLinks": planShowLinks = !planShowLinks; render(); break;
    case "copyPlanText": doCopyPlanText(); break;
    case "exportPlanPdf": doExportPlanPdf(); break;
    case "saveChurchSettings": doSaveChurchSettings(); break;
    case "switchHymnal": doSwitchHymnal(arg); break;
  }
});

// File import listener
document.addEventListener("change", function(e) {
  if (e.target.id === "importFileInput" && e.target.files.length) {
    importData(e.target.files[0]);
    e.target.value = "";
  }
  if (e.target.id === "csvImportInput" && e.target.files.length) {
    handleCsvFile(e.target.files[0]);
    e.target.value = "";
  }
  if (e.target.id === "sortSelect") { sort = e.target.value; render(); }
});

// Keydown delegation for Enter on inputs
document.addEventListener("keydown", function(e) {
  if (e.key !== "Enter") return;
  var el = e.target;
  if (!el.dataset.enterAction) return;
  e.stopPropagation();
  var action = el.dataset.enterAction;
  var key = el.dataset.key || "";
  if (action === "addTag") doAddTag(key);
  if (action === "addNote") doAddNote(key);
  if (action === "addKey") doAddKey(key);
  if (action === "addInstrument") doAddInstrument(key);
  if (action === "addTeamMember") doAddTeamMember();
});

// Search input
document.addEventListener("input", function(e) {
  if (e.target.id === "searchInput") { query = e.target.value; render(); }
  if (e.target.id === "planSearchInput") { planSearchQuery = e.target.value; render();
    setTimeout(function(){ var el = document.getElementById("planSearchInput"); if(el){ el.focus(); el.selectionStart = el.selectionEnd = el.value.length; } }, 10);
  }
  if (e.target.id && e.target.id.startsWith("tpl-input-")) {
    var idx = parseInt(e.target.id.replace("tpl-input-", ""));
    if (serviceTemplate[idx]) { serviceTemplate[idx].label = e.target.value; }
  }
});

function doAddTag(key) {
  var inp = document.getElementById("tagInput-" + key);
  var s = findSong(key);
  if (s && inp && inp.value.trim() && !s.tags.includes(inp.value.trim())) {
    s.tags.push(inp.value.trim());
    update(s);
  }
}

function doAddNote(key) {
  var inp = document.getElementById("noteInput-" + key);
  var s = findSong(key);
  if (s && inp && inp.value.trim()) { s.notes.push(inp.value.trim()); update(s); }
}

function doLogUsage(key, date) {
  var s = findSong(key);
  if (s && !s.usageDates.includes(date)) {
    s.usageDates.unshift(date);
    s.usageDates.sort(function(a,b){return b.localeCompare(a);});
    update(s);
  }
}

function doToggleKey(key, k) {
  var s = findSong(key);
  if (!s) return;
  var allKeys = s.keys ? s.keys.split(/[,\/]/).map(function(x){return x.trim();}).filter(Boolean) : [];
  var current = displayKeys(s) ? displayKeys(s).split(/[,\/]/).map(function(x){return x.trim();}).filter(Boolean) : allKeys.slice();
  var idx = current.indexOf(k);
  if (idx >= 0) { current.splice(idx, 1); }
  else { current.push(k); }
  s.editedKeys = current.join(", ");
  update(s);
}

function doAddKey(key) {
  var inp = document.getElementById("keyInput-" + key);
  var s = findSong(key);
  if (!s || !inp || !inp.value.trim()) return;
  var current = displayKeys(s) ? displayKeys(s).split(/[,\/]/).map(function(x){return x.trim();}).filter(Boolean) : [];
  var newKey = inp.value.trim();
  if (!current.includes(newKey)) { current.push(newKey); }
  s.editedKeys = current.join(", ");
  // Also add to base keys string so it shows in the toggle list
  var allKeys = s.keys ? s.keys.split(/[,\/]/).map(function(x){return x.trim();}).filter(Boolean) : [];
  if (!allKeys.includes(newKey)) { s.keys = s.keys ? s.keys + ", " + newKey : newKey; }
  update(s);
}

function doResetKeys(key) {
  var s = findSong(key);
  if (!s) return;
  s.editedKeys = "";
  update(s);
}

function doSaveSongOrder(key) {
  var inp = document.getElementById("orderInput-" + key);
  var s = findSong(key);
  if (!s || !inp) return;
  s.songOrder = inp.value.trim();
  update(s);
}

function doSaveCcli(key) {
  var inp = document.getElementById("ccliInput-" + key);
  var s = findSong(key);
  if (!s || !inp) return;
  s.ccli = inp.value.trim();
  update(s);
}

function doAddLink(key) {
  var urlInp = document.getElementById("linkUrlInput-" + key);
  var labelInp = document.getElementById("linkLabelInput-" + key);
  var s = findSong(key);
  if (!s || !urlInp || !urlInp.value.trim()) return;
  if (!s.links) s.links = [];
  var url = urlInp.value.trim();
  var label = labelInp ? labelInp.value.trim() : "";
  // Auto-label from URL if no label given
  if (!label) {
    var llc = url.toLowerCase();
    if (llc.includes('youtube') || llc.includes('youtu.be')) label = 'YouTube';
    else if (llc.includes('spotify')) label = 'Spotify';
    else label = url.replace(/^https?:\/\//, '').split('/')[0];
  }
  s.links.push({ url: url, label: label });
  update(s);
}

function doRemoveLink(key, idx) {
  var s = findSong(key);
  if (!s || !s.links) return;
  s.links.splice(idx, 1);
  update(s);
}

const ROLE_OPTIONS = ["Worship Leader", "Pianist", "Vocals", "Drums", "Bass", "Guitar", "Sound Tech"];

function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 5); }

async function doAddTeamMember() {
  var inp = document.getElementById("newMemberName");
  if (!inp || !inp.value.trim()) return;
  var member = {
    id: generateId(),
    name: inp.value.trim(),
    role: "",
    roles: [],
    instruments: [],
    availability: {},
    notes: ""
  };
  teamMembers.push(member);
  await saveTeamMember(member);
  teamEditId = member.id;
  teamModalOpen = true;
  showSaveIndicator();
  render();
}

async function doRemoveMember(id) {
  teamMembers = teamMembers.filter(function(m) { return m.id !== id; });
  await deleteTeamMember(id);
  if (expandedMember === id) expandedMember = null;
  teamModalOpen = false; teamEditId = null;
  showSaveIndicator();
  render();
}

async function doSetRole(id, role) {
  var m = teamMembers.find(function(m) { return m.id === id; });
  if (!m) return;
  m.role = m.role === role ? "" : role;
  await saveTeamMember(m);
  showSaveIndicator();
  render();
}

async function doToggleRole(id, role) {
  var m = teamMembers.find(function(m) { return m.id === id; });
  if (!m) return;
  if (!m.roles) m.roles = m.role ? [m.role] : [];
  var idx = m.roles.indexOf(role);
  if (idx >= 0) m.roles.splice(idx, 1);
  else m.roles.push(role);
  m.role = m.roles[0] || "";
  await saveTeamMember(m);
  showSaveIndicator();
  render();
}

async function doSaveMemberName(id) {
  var inp = document.getElementById("editMemberName");
  var m = teamMembers.find(function(m) { return m.id === id; });
  if (!m || !inp || !inp.value.trim()) return;
  m.name = inp.value.trim();
  await saveTeamMember(m);
  showSaveIndicator();
  render();
}

function getMemberRoles(m) {
  if (m.roles && m.roles.length) return m.roles.join(" \u00B7 ");
  if (m.role) return m.role;
  return "";
}

async function doAddInstrument(id) {
  var inp = document.getElementById("instInput-" + id);
  var m = teamMembers.find(function(m) { return m.id === id; });
  if (!m || !inp || !inp.value.trim()) return;
  var val = inp.value.trim();
  if (!m.instruments.includes(val)) {
    m.instruments.push(val);
    await saveTeamMember(m);
    showSaveIndicator();
  }
  render();
}

async function doRemoveInstrument(id, inst) {
  var m = teamMembers.find(function(m) { return m.id === id; });
  if (!m) return;
  m.instruments = m.instruments.filter(function(i) { return i !== inst; });
  await saveTeamMember(m);
  showSaveIndicator();
  render();
}

async function doSetAvailability(id, status, date) {
  var m = teamMembers.find(function(m) { return m.id === id; });
  if (!m) return;
  if (m.availability[date] === status) {
    delete m.availability[date];
  } else {
    m.availability[date] = status;
  }
  await saveTeamMember(m);
  showSaveIndicator();
  render();
}

function showSaveIndicator() {
  saveStatus = "saving";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    saveStatus = "saved"; render();
    setTimeout(function(){ saveStatus = ""; render(); }, 2000);
  }, 300);
}

function getUpcomingSundays(count) {
  var sundays = [];
  var d = new Date();
  var day = d.getDay();
  var diff = day === 0 ? 0 : 7 - day;
  d.setDate(d.getDate() + diff);
  for (var i = 0; i < count; i++) {
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var dd = String(d.getDate()).padStart(2, "0");
    sundays.push(y + "-" + m + "-" + dd);
    d.setDate(d.getDate() + 7);
  }
  return sundays;
}

function rebuildSongs() {
  var merged = mergeSongs(getHymnalSongs(), {});
  // Re-merge with user data asynchronously handled by caller
  var customs = customSongsRaw.map(customToSong);
  songs = merged.concat(customs);
}

async function rebuildSongsAsync() {
  var userData = await loadAllUserData();
  var merged = mergeSongs(getHymnalSongs(), userData);
  var customs = customSongsRaw.map(customToSong);
  songs = merged.concat(customs);
}

async function doSaveManualSong() {
  var title = (document.getElementById("cs-title") || {}).value || "";
  if (!title.trim()) { alert("Title is required."); return; }

  var song = {
    id: generateId(),
    title: title.trim(),
    hymnNumber: parseInt((document.getElementById("cs-number") || {}).value) || 0,
    keys: ((document.getElementById("cs-keys") || {}).value || "").trim(),
    wordsBy: ((document.getElementById("cs-wordsBy") || {}).value || "").trim(),
    musicBy: ((document.getElementById("cs-musicBy") || {}).value || "").trim(),
    year: parseInt((document.getElementById("cs-year") || {}).value) || 0,
    tune: ((document.getElementById("cs-tune") || {}).value || "").trim(),
    firstLine: ((document.getElementById("cs-firstLine") || {}).value || "").trim(),
    scripture: ((document.getElementById("cs-scripture") || {}).value || "").trim(),
    tags: [],
    category: "",
    notes: [],
    usageDates: []
  };

  customSongsRaw.push(song);
  await saveCustomSong(song);
  await rebuildSongsAsync();
  showAddSongForm = false;
  expanded = songKey(customToSong(song));
  showSaveIndicator();
  render();
  setTimeout(function() {
    var el = document.getElementById("song-" + expanded);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
  }, 100);
}

async function handleCsvFile(file) {
  try {
    var text = await file.text();
    var result = parseCSV(text);
    if (!result || result.rows.length === 0) {
      alert("Could not parse any songs from this CSV. Make sure it has a header row with a Title column.");
      return;
    }
    csvImportData = result;
    render();
  } catch(e) {
    alert("Error reading file: " + e.message);
  }
}

async function doConfirmCsvImport() {
  if (!csvImportData || !csvImportData.rows.length) return;

  var count = 0;
  for (var i = 0; i < csvImportData.rows.length; i++) {
    var r = csvImportData.rows[i];
    var song = {
      id: generateId(),
      title: r.title,
      hymnNumber: r.hymnNumber || 0,
      keys: r.keys || "",
      wordsBy: r.wordsBy || "",
      musicBy: r.musicBy || "",
      year: r.year || 0,
      tune: r.tune || "",
      firstLine: r.firstLine || "",
      scripture: r.scripture || "",
      tags: [],
      category: "",
      notes: [],
      usageDates: []
    };
    customSongsRaw.push(song);
    await saveCustomSong(song);
    count++;
  }

  await rebuildSongsAsync();
  csvImportData = null;
  showAddSongForm = false;
  filter = "custom";
  showSaveIndicator();
  showImportStatus("success", "Imported " + count + " custom songs!");
  render();
}

async function doDeleteCustomSong(customId) {
  customSongsRaw = customSongsRaw.filter(function(c) { return c.id !== customId; });
  await deleteCustomSong(customId);
  expanded = null;
  await rebuildSongsAsync();
  showSaveIndicator();
  render();
}

function render() {
  var app = document.getElementById("app");
  if (!loaded) {
    app.innerHTML = '<div class="loading"><img src="' + (isDarkMode() ? LOGO_DARK : LOGO_LIGHT) + '" alt="" style="width:64px;height:64px;border-radius:50%;object-fit:cover"><div class="logo" style="font-size:28px">Church Music Planner</div><div style="font-size:14px;color:var(--text2)">Loading your data...</div></div>';
    return;
  }

  var filtered = getFiltered();
  var nextSunday = getNextSunday();
  var h = "";

  // Preview overlay
  if (previewOpen) h += renderPreviewOverlay(nextSunday);

  // Header
  h += '<div class="header">';
  h += '<div class="header-row">';
  h += '<div style="display:flex;align-items:center;gap:8px">';
  h += '<div class="logo"><img src="' + (isDarkMode() ? LOGO_DARK : LOGO_LIGHT) + '" alt="" style="width:28px;height:28px;vertical-align:middle;margin-right:6px;border-radius:50%;object-fit:cover">Church Music Planner</div>';
  h += '<button class="theme-toggle" data-action="toggleTheme">' + (isDarkMode()?'\u2600\uFE0F':'\u{1F319}') + '</button>';
  if (saveStatus) {
    h += '<span class="sync ' + (saveStatus==="saving"?"sync-saving":"sync-saved") + '">';
    h += (saveStatus==="saving"?"Saving...":"Saved") + '</span>';
  }
  h += '</div>';
  if (tab === "catalog") {
    h += '<div style="display:flex;align-items:center;gap:8px">';
    h += '<span class="count">' + filtered.length + ' songs</span>';
    h += '<select class="sort" id="sortSelect">';
    h += '<option value="number"' + (sort==="number"?" selected":"") + '># Order</option>';
    h += '<option value="alpha"' + (sort==="alpha"?" selected":"") + '>A\u2013Z</option>';
    h += '<option value="year"' + (sort==="year"?" selected":"") + '>Newest</option>';
    h += '</select></div>';
  }
  if (tab === "dashboard") h += '<div class="count">Dashboard</div>';
  if (tab === "plan") h += '<div class="count">Service Plan</div>';
  if (tab === "team") h += '<div class="count">' + teamMembers.length + ' member' + (teamMembers.length!==1?'s':'') + '</div>';
  if (tab === "admin") h += '<div class="count">Settings</div>';
  h += '</div>';

  // Search + filters (catalog only)
  if (tab === "catalog") {
    h += '<div class="search-wrap">';
    h += '<span class="search-icon">\uD83D\uDD0D</span>';
    h += '<input class="search" id="searchInput" value="' + E(query) + '" placeholder="Search title, tune, author, scripture...">';
    if (query) h += '<button class="search-clear" data-action="clearSearch">\u2715</button>';
    h += '</div>';
    h += '<div class="filters">';
    getFilters().forEach(function(f) {
      h += '<button class="chip' + (filter===f.value?' active':'') + '" data-action="setFilter" data-arg="' + f.value + '">' + f.label + '</button>';
    });
    h += '</div>';
  }
  h += '</div>';

  // Content
  if (tab === "dashboard") h += renderDashboard(nextSunday);
  if (tab === "plan") h += renderPlanTab();
  if (tab === "team") h += renderTeamTab();
  if (tab === "catalog") {
    h += '<div class="song-list">';
    // Add songs button
    h += '<div style="display:flex;gap:8px;margin-bottom:8px">';
    h += '<button class="btn ' + (showAddSongForm?'btn-ghost':'btn-copper') + '" style="flex:1;padding:9px 14px;font-size:13px;border-radius:8px" data-action="toggleAddSongForm">' + (showAddSongForm?'\u2715 Close':'\u2795 Add Songs') + '</button>';
    h += '</div>';
    if (showAddSongForm) h += renderAddSongForm();
    if (filtered.length === 0) {
      h += '<div class="empty"><div style="font-size:40px;margin-bottom:12px;opacity:0.5">\u266A</div><div style="font-size:15px">No songs match your search</div></div>';
    } else {
      filtered.forEach(function(s) { h += renderCard(s); });
    }
    h += '</div>';
  }
  if (tab === "admin") h += renderAdminTab();

  // Tab bar
  h += '<div class="tab-bar"><div class="tab-bar-inner">';
  h += '<button class="tab' + (tab==="dashboard"?" active":"") + '" data-action="setTab" data-arg="dashboard"><span class="tab-icon">\u25E9</span>Home</button>';
  h += '<button class="tab' + (tab==="catalog"?" active":"") + '" data-action="setTab" data-arg="catalog"><span class="tab-icon">\u266A</span>Catalog</button>';
  h += '<button class="tab' + (tab==="plan"?" active":"") + '" data-action="setTab" data-arg="plan"><span class="tab-icon">\uD83D\uDCCB</span>Plan</button>';
  h += '<button class="tab' + (tab==="team"?" active":"") + '" data-action="setTab" data-arg="team"><span class="tab-icon">\uD83D\uDC65</span>Team</button>';
  h += '<button class="tab' + (tab==="admin"?" active":"") + '" data-action="setTab" data-arg="admin"><span class="tab-icon">\u2699\uFE0F</span>Settings</button>';
  h += '</div></div>';

function parseCSV(text) {
  var lines = text.split(/\r?\n/).filter(function(l) { return l.trim(); });
  if (lines.length < 2) return null;

  // Parse header
  var headers = parseCSVLine(lines[0]).map(function(h) { return h.trim().toLowerCase(); });

  // Auto-map columns
  var colMap = {};
  var mappings = {
    title: ["title", "displaytitle", "texttitle", "hymn title", "song title", "name"],
    hymnNumber: ["hymn number", "number", "hymn #", "hymn no", "#", "no"],
    keys: ["keys", "key", "musical key", "musical keys"],
    wordsBy: ["words by", "wordsby", "author", "authors", "text author", "lyricist", "words"],
    musicBy: ["music by", "musicby", "composer", "composers", "tune author", "music"],
    year: ["year", "date", "pub year", "published"],
    tune: ["tune", "tunetitle", "tune name", "tune title", "melody"],
    firstLine: ["first line", "firstline", "first_line", "incipit", "opening line"],
    scripture: ["scripture", "scripture references", "scripture refs", "bible ref", "scripturereferences"]
  };

  Object.keys(mappings).forEach(function(field) {
    mappings[field].forEach(function(alias) {
      var idx = headers.indexOf(alias);
      if (idx >= 0 && !colMap[field]) colMap[field] = idx;
    });
  });

  if (!colMap.title && colMap.title !== 0) {
    // Try first non-number column as title
    for (var i = 0; i < headers.length; i++) {
      if (headers[i] && !headers[i].match(/^(number|#|no|hymn)/)) { colMap.title = i; break; }
    }
  }

  var rows = [];
  for (var i = 1; i < lines.length; i++) {
    var cols = parseCSVLine(lines[i]);
    var title = colMap.title !== undefined ? (cols[colMap.title] || "").trim() : "";
    if (!title) continue;
    rows.push({
      title: title,
      hymnNumber: colMap.hymnNumber !== undefined ? parseInt(cols[colMap.hymnNumber]) || 0 : 0,
      keys: colMap.keys !== undefined ? (cols[colMap.keys] || "").trim() : "",
      wordsBy: colMap.wordsBy !== undefined ? (cols[colMap.wordsBy] || "").trim() : "",
      musicBy: colMap.musicBy !== undefined ? (cols[colMap.musicBy] || "").trim() : "",
      year: colMap.year !== undefined ? parseInt(cols[colMap.year]) || 0 : 0,
      tune: colMap.tune !== undefined ? (cols[colMap.tune] || "").trim() : "",
      firstLine: colMap.firstLine !== undefined ? (cols[colMap.firstLine] || "").trim() : "",
      scripture: colMap.scripture !== undefined ? (cols[colMap.scripture] || "").trim() : ""
    });
  }

  return { headers: headers, colMap: colMap, rows: rows };
}

function parseCSVLine(line) {
  var result = [];
  var current = "";
  var inQuotes = false;
  for (var i = 0; i < line.length; i++) {
    var ch = line[i];
    if (inQuotes) {
      if (ch === '"' && line[i+1] === '"') { current += '"'; i++; }
      else if (ch === '"') { inQuotes = false; }
      else { current += ch; }
    } else {
      if (ch === '"') { inQuotes = true; }
      else if (ch === ',') { result.push(current); current = ""; }
      else { current += ch; }
    }
  }
  result.push(current);
  return result;
}

async function doPlanNav(days) {
  // Save any pending template edits
  if (editingTemplate) await saveServiceTemplate(serviceTemplate);
  var d = new Date(planDate + "T12:00:00");
  d.setDate(d.getDate() + days);
  // Snap to Sunday
  var day = d.getDay();
  if (day !== 0) d.setDate(d.getDate() + (7 - day));
  var y = d.getFullYear();
  var m = String(d.getMonth() + 1).padStart(2, "0");
  var dd = String(d.getDate()).padStart(2, "0");
  planDate = y + "-" + m + "-" + dd;
  planSearchSlot = null;
  planSearchQuery = "";
  currentPlan = await loadServicePlan(planDate);
  render();
}

async function doAssignPlanSong(slotId, sKey) {
  if (!currentPlan) currentPlan = { date: planDate, assignments: {} };
  currentPlan.assignments[slotId] = sKey;
  await saveServicePlan(currentPlan);
  planSearchSlot = null;
  planSearchQuery = "";

  // Also log for this Sunday if not already
  var s = findSong(sKey);
  if (s && !s.usageDates.includes(planDate)) {
    s.usageDates.unshift(planDate);
    s.usageDates.sort(function(a,b){return b.localeCompare(a);});
    update(s);
  }

  showSaveIndicator();
  render();
}

async function doClearPlanSlot(slotId) {
  if (!currentPlan) return;
  delete currentPlan.assignments[slotId];
  await saveServicePlan(currentPlan);
  showSaveIndicator();
  render();
}

async function doToggleTemplateEdit() {
  if (editingTemplate) {
    // Save on close
    await saveServiceTemplate(serviceTemplate);
    showSaveIndicator();
  }
  editingTemplate = !editingTemplate;
  render();
}

async function doToggleTemplateType(idx) {
  if (serviceTemplate[idx]) {

async function doMoveTemplateItem(idx, direction) {
  var newIdx = direction === "up" ? idx - 1 : idx + 1;
  if (newIdx < 0 || newIdx >= serviceTemplate.length) return;
  var temp = serviceTemplate[idx];
  serviceTemplate[idx] = serviceTemplate[newIdx];
  serviceTemplate[newIdx] = temp;
  render();
}

async function doRemoveTemplateItem(idx) {

}

  html += '.text-el{font-size:10px;font-weight:bold;color:#3B5998;text-transform:uppercase;letter-spacing:.4px;margin:10px 0 4px}';
  html += '.song{margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #DAD8D2;display:flex;gap:6px;align-items:baseline}';
  html += '.song-num{font-size:16px;color:#B8860B;min-width:26px;font-weight:bold}';
  html += '.song-title{font-size:13px;font-weight:bold;color:#1A1A2E}';
  html += '.song-sub{font-size:9px;color:#4A4A6A;margin-top:1px}';
  html += '.song-order{font-size:9px;color:#3B5998;font-style:italic;margin-top:1px}';
  html += '.song-link{font-size:8px;color:#3B5998;text-decoration:none;margin-right:8px}';
  html += '.not-assigned{font-size:10px;color:#7A7A96;font-style:italic;margin-bottom:8px}';
  html += '@media print{body{padding:12px 20px}@page{margin:0.5in}}';
  html += '</style></head><body>';
  html += '<div class="header-block">';

  if (appSettings.churchLocation) html += '<div class="church-loc">' + E(appSettings.churchLocation) + '</div>';

        html += '<div class="song">';
        html += '<span class="song-num">' + (assigned.hymnNumber || '') + '</span>';
        html += '<div>';
        html += '<div class="song-title">' + E(assigned.title) + '</div>';

        var dk = displayKeys(assigned);
        if (dk) subParts.push(dk);
        if (assigned.ccli) subParts.push('CCLI #' + assigned.ccli);
        if (subParts.length) html += '<div class="song-sub">' + E(subParts.join('  \u00B7  ')) + '</div>';
        if (assigned.songOrder) html += '<div class="song-order">' + E(assigned.songOrder) + '</div>';

        html += '<div class="not-assigned">' + E(item.label) + ' \u2014 (not assigned)</div>';
      }
    }
  });

  html += '<script>window.onload=function(){window.print();}<\/script>';
  html += '</body></html>';

  var w = window.open('', '_blank');
  if (w) {
    w.document.write(html);
    w.document.close();
  } else {
    alert('Please allow pop-ups to export PDF.');
  }
}

function renderPlanTab() {

  h += '<button data-action="planNextWeek">\u25B6</button>';

  var loggedSongs = songs.filter(function(s) { return s.usageDates.includes(planDate); });

  h += '<div style="display:flex;gap:8px;margin-bottom:10px">';

function renderPlanItems(loggedSongs) {
  var h = '';
  var assignments = currentPlan ? currentPlan.assignments || {} : {};

  serviceTemplate.forEach(function(item, idx) {
    var assigned = assignments[item.id] ? findSong(assignments[item.id]) : null;
    var isSearching = planSearchSlot === item.id;

    if (item.type === "text") {
      h += '<div class="plan-item">';
      h += '<div style="font-size:14px;font-weight:600;color:var(--accent2)">' + E(item.label) + '</div>';
      h += '</div>';
    } else {
      h += '<div class="plan-item is-song' + (assigned?' has-song':'') + '">';
      h += '<div style="display:flex;justify-content:space-between;align-items:flex-start">';
      h += '<div>';
      h += '<div class="plan-label">' + E(item.label) + '</div>';
      if (assigned) {
        h += '<div class="plan-song-name">' + E(assigned.title) + '</div>';
        var sub = '';
        if (assigned.hymnNumber) sub += '#' + assigned.hymnNumber;
        var dk = displayKeys(assigned);
        if (dk) sub += (sub?' \u00B7 ':'') + dk;
        if (assigned.ccli) sub += (sub?' \u00B7 ':'') + 'CCLI ' + assigned.ccli;
        if (sub) h += '<div class="plan-song-sub">' + E(sub) + '</div>';
        if (assigned.songOrder) h += '<div style="font-size:11px;color:var(--accent2);margin-top:2px;font-style:italic">' + E(assigned.songOrder) + '</div>';
      } else {
        h += '<div style="font-size:13px;color:var(--text3);margin-top:2px;font-style:italic">No song selected</div>';
      }
      h += '</div>';
      h += '<div style="display:flex;gap:4px">';
      if (assigned) {
        h += '<button class="btn btn-ghost" style="padding:4px 8px;font-size:11px" data-action="clearPlanSlot" data-key="' + item.id + '">\u2715</button>';
      }
      h += '<button class="btn ' + (isSearching?'btn-copper':'btn-ghost') + '" style="padding:4px 10px;font-size:11px" data-action="togglePlanSearch" data-key="' + item.id + '">' + (isSearching?'Close':assigned?'Change':'\uD83D\uDD0D Pick') + '</button>';
      h += '</div></div>';

      // Song search
      if (isSearching) {
        h += '<div class="plan-search-box">';
        h += '<input class="plan-search-input" id="planSearchInput" value="' + E(planSearchQuery) + '" placeholder="Search songs...">';

        // Quick picks from logged songs
        if (loggedSongs.length > 0 && !planSearchQuery) {
          h += '<div style="margin-top:6px"><div style="font-size:11px;color:var(--text2);margin-bottom:4px">Logged for this Sunday:</div>';
          h += '<div class="plan-quick-picks">';
          loggedSongs.forEach(function(s) {
            h += '<button class="plan-quick-pick" data-action="assignPlanSong" data-key="' + item.id + '" data-arg="' + E(songKey(s)) + '">' + E(s.title) + '</button>';
          });
          h += '</div></div>';
        }

        // Search results
        if (planSearchQuery.trim()) {
          var q = planSearchQuery.toLowerCase().trim();
          var results = songs.filter(function(s) {
            return s.title.toLowerCase().includes(q) ||
              s.tune.toLowerCase().includes(q) ||
              s.wordsBy.toLowerCase().includes(q) ||
              s.firstLine.toLowerCase().includes(q) ||
              String(s.hymnNumber).includes(q);
          }).slice(0, 12);

          if (results.length) {
            h += '<div class="plan-results">';
            results.forEach(function(s) {
              h += '<div class="plan-result-item" data-action="assignPlanSong" data-key="' + item.id + '" data-arg="' + E(songKey(s)) + '">';
              h += '<span style="color:var(--accent);font-weight:600;min-width:30px">' + (s.hymnNumber||'') + '</span>';
              h += '<div style="flex:1;min-width:0"><div style="font-weight:500">' + E(s.title) + '</div>';
              var sub2 = '';
              if (s.tune) sub2 += s.tune;
              if (s.keys) sub2 += (sub2?' \u00B7 ':'') + s.keys;
              if (sub2) h += '<div style="font-size:11px;color:var(--text2)">' + E(sub2) + '</div>';
              h += '</div></div>';
            });
            h += '</div>';
          } else {
            h += '<div style="font-size:12px;color:var(--text3);padding:8px;text-align:center">No songs found</div>';
          }
        }
        h += '</div>';
      }

      h += '</div>';
    }
  });

  return h;
}

function buildPlanText() {
  var assignments = currentPlan ? currentPlan.assignments || {} : {};
  var lines = [];
  if (appSettings.churchName) lines.push(appSettings.churchName);
  if (appSettings.churchLocation) lines.push(appSettings.churchLocation);
  lines.push("", "Order of Worship", formatDate(planDate), "");
  serviceTemplate.forEach(function(item) {
    if (item.type === "text") {
      lines.push(item.label.toUpperCase());
    } else {
      var assigned = assignments[item.id] ? findSong(assignments[item.id]) : null;
      if (assigned) {
        var line = "";
        if (assigned.hymnNumber) line += "#" + assigned.hymnNumber + " ";
        line += assigned.title;
        var dk = displayKeys(assigned);
        if (dk) line += " [" + dk + "]";
        if (assigned.ccli) line += " (CCLI #" + assigned.ccli + ")";
        lines.push("  " + line);
        if (assigned.songOrder) lines.push("    " + assigned.songOrder);
        if (planShowLinks && assigned.links && assigned.links.length) {
          assigned.links.forEach(function(lnk) { lines.push("    " + (lnk.label || '') + ": " + lnk.url); });
        }
      } else {
        lines.push("  " + item.label + " - (not assigned)");
      }
    }
  });
  return lines.join("\n");
}

function renderDashboard(nextSunday) {
  var sundaySongs = songs.filter(function(s){return s.usageDates.includes(nextSunday);});
  var usedSongs = songs.filter(function(s){return s.usageDates.length > 0;});
  var usedCount = usedSongs.length;
  var neverUsed = songs.length - usedCount;
  var taggedCount = songs.filter(function(s){return s.tags.length > 0;}).length;

  var recentlyUsed = usedSongs
    .map(function(s){return Object.assign({},s,{lastDate:s.usageDates[0]});})
    .sort(function(a,b){return b.lastDate.localeCompare(a.lastDate);}).slice(0, 8);

  var mostUsed = usedSongs.slice().sort(function(a,b){return b.usageDates.length - a.usageDates.length;}).slice(0, 7);

  var tagCounts = {};
  songs.forEach(function(s){s.tags.forEach(function(t){tagCounts[t]=(tagCounts[t]||0)+1;});});
  var tagRanking = Object.entries(tagCounts).sort(function(a,b){return b[1]-a[1];}).slice(0,10);

  var now = new Date(); now.setHours(0,0,0,0);
  var neglected = usedSongs.map(function(s) {
    var last = new Date(s.usageDates[0]+"T12:00:00"); last.setHours(0,0,0,0);
    return Object.assign({},s,{daysSince:Math.floor((now-last)/864e5)});
  }).filter(function(s){return s.daysSince>60;}).sort(function(a,b){return b.daysSince-a.daysSince;}).slice(0,6);

  var h = '<div style="padding:0 16px">';

  // Sunday
  h += '<div class="dash-card">';
  h += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">';
  h += '<div class="section-label" style="margin-bottom:0">\uD83D\uDCC5 This Sunday \u2014 ' + formatDate(nextSunday) + '</div>';
  if (sundaySongs.length > 0) {
    h += '<div style="display:flex;gap:6px">';
    h += '<button class="btn btn-ghost" style="padding:4px 10px" data-action="handleCopy">' + (copied?'Copied!':'Copy') + '</button>';
    h += '<button class="btn btn-copper" style="padding:4px 10px" data-action="openPreview">Preview</button>';
    h += '</div>';
  }
  h += '</div>';
  if (sundaySongs.length === 0) {
    h += '<div style="font-size:13px;color:var(--text3);font-style:italic;padding:8px 0">No songs logged yet. Open the catalog and log songs for Sunday.</div>';
  } else {
    sundaySongs.forEach(function(s) {
      h += miniRow(s, s.tune + (s.keys?' \u00B7 '+s.keys:'') + (s.category?' \u00B7 '+s.category:''));
    });
  }
  h += '</div>';

  // Stats
  h += '<div class="stats-row">';
  h += statBox("Total Songs", songs.length, TC("accent2"));
  h += statBox("Used", usedCount, TC("green"));
  h += statBox("Never Used", neverUsed, TC("text3"));
  h += statBox("Tagged", taggedCount, TC("accent"));
  h += '</div>';

  // Recently used
  if (recentlyUsed.length) {
    h += '<div class="dash-card"><div class="section-label">\uD83D\uDD50 Recently Used</div>';
    recentlyUsed.forEach(function(s) {
      h += miniRow(s, formatDate(s.lastDate) + ' \u00B7 ' + daysAgo(s.lastDate));
    });
    h += '</div>';
  }

  // Most used
  if (mostUsed.length) {
    var maxUse = mostUsed[0].usageDates.length;
    h += '<div class="dash-card"><div class="section-label">\u2B50 Most Used Songs</div>';
    mostUsed.forEach(function(s,i) {
      var pct = (s.usageDates.length / maxUse * 100);
      h += '<div data-action="navigateToSong" data-key="' + E(songKey(s)) + '" style="display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;' + (i<mostUsed.length-1?'border-bottom:1px solid var(--border2)':'') + '">';
      h += '<div class="mini-num">' + s.hymnNumber + '</div>';
      h += '<div style="flex:1;min-width:0">';
      h += '<div class="mini-title">' + E(s.title) + '</div>';
      h += '<div style="display:flex;align-items:center;gap:6px;margin-top:3px">';
      h += '<div class="mu-bar-bg"><div class="mu-bar" style="width:' + pct + '%"></div></div>';
      h += '<span style="font-size:11px;color:var(--text2);font-weight:600;min-width:16px">' + s.usageDates.length + '\u00D7</span>';
      h += '</div></div></div>';
    });
    h += '</div>';
  }

  // Top tags
  if (tagRanking.length) {
    h += '<div class="dash-card"><div class="section-label">\uD83C\uDFF7\uFE0F Top Tags</div><div class="tag-cloud">';
    tagRanking.forEach(function(entry, i) {
      var tag = entry[0], count = entry[1];
      var big = i < 3;
      var bg, color;
      if (i===0) { bg=TC("accent"); color='#fff'; }
      else if (i<3) { bg=TC("cat-bg"); color=TC("accent"); }
      else { bg=TC("ghost-bg"); color=TC("text2"); }
      h += '<span style="font-size:' + (big?14:12) + 'px;padding:' + (big?'5px 14px':'4px 10px') + ';border-radius:16px;font-weight:' + (big?600:500) + ';background:' + bg + ';color:' + color + '">' + E(tag) + ' (' + count + ')</span>';
    });
    h += '</div></div>';
  }

  // Neglected
  if (neglected.length) {
    h += '<div class="dash-card"><div class="section-label">\u23F3 Haven\'t Used in 60+ Days</div>';
    neglected.forEach(function(s) {
      h += miniRow(s, 'Last used ' + daysAgo(s.usageDates[0]) + ' \u2014 ' + formatDate(s.usageDates[0]));
    });
    h += '</div>';
  }

  // Empty state
  if (recentlyUsed.length === 0) {
    h += '<div class="dash-card" style="text-align:center;padding:32px 20px;color:var(--text2)">';
    h += '<div style="font-size:32px;margin-bottom:8px">\u266A</div>';
    h += '<div style="font-size:15px;font-weight:500;margin-bottom:4px">Start logging songs!</div>';
    h += '<div style="font-size:13px">Switch to the Catalog tab, find a song, and log it for a date. Your dashboard will come alive.</div>';
    h += '</div>';
  }

  h += '</div>';
  return h;
}

function renderPreviewOverlay(nextSunday) {

  var h = '<div class="overlay" data-action="closeOverlay">';
  h += '<div class="preview-box" style="pointer-events:auto">';

function getFiltered() {
  var list = songs.filter(function(s){return filterSong(s, filter);});
  if (query.trim()) {
    var q = query.toLowerCase().trim();
    list = list.filter(function(s) {
      return s.title.toLowerCase().includes(q) ||
        s.firstLine.toLowerCase().includes(q) ||
        s.tune.toLowerCase().includes(q) ||
        s.wordsBy.toLowerCase().includes(q) ||
        s.musicBy.toLowerCase().includes(q) ||
        s.scripture.toLowerCase().includes(q) ||
        s.category.toLowerCase().includes(q) ||
        s.tags.some(function(t){return t.toLowerCase().includes(q);}) ||
        s.notes.some(function(n){return n.toLowerCase().includes(q);}) ||
        String(s.hymnNumber).includes(q);
    });
  }
  if (sort === "alpha") list.sort(function(a,b){return a.title.localeCompare(b.title);});
  else if (sort === "year") list.sort(function(a,b){return (b.year||0)-(a.year||0);});
  else list.sort(function(a,b){return a.hymnNumber-b.hymnNumber;});
  return list;
}

function findSong(key) { return songs.find(function(s){return songKey(s)===key;}); }

  saveSong(s);

  tab = "catalog";

function buildExportText() {
  var ns = getNextSunday();
  var ss = songs.filter(function(s){return s.usageDates.includes(ns);});
  var t = "WORSHIP SERVICE \u2014 " + formatDate(ns) + "\n" + "\u2550".repeat(40) + "\n\n";
  ss.forEach(function(s,i) {
    t += (i+1) + ". #" + s.hymnNumber + " \u2014 " + s.title + "\n";
    if (s.category) t += "   Category: " + s.category + "\n";
    t += "   Tune: " + s.tune;
    if (s.keys) t += "  |  Key(s): " + s.keys;
    t += "\n";
    if (s.firstLine) t += '   "' + s.firstLine + '"\n';
    if (s.scripture) t += "   Scripture: " + s.scripture + "\n";
    t += "\n";
  });
  t += "\u2500".repeat(40) + "\n" + ss.length + " song" + (ss.length!==1?"s":"") + " planned";
  return t;
}

function handleCopy() {
  navigator.clipboard.writeText(buildExportText()).then(function() {
    copied = true; render();
    clearTimeout(copiedTimer);
    copiedTimer = setTimeout(function(){ copied = false; render(); }, 2000);
  }).catch(function(){});

// ============================================================
// BACKUP & RESTORE
// ============================================================
async function exportData() {
  try {
    var userData = await loadAllUserData();
    var entries = Object.values(userData);
    var team = await loadTeamMembers();
    var customs = await loadCustomSongs();
    var plans = await loadAllServicePlans();
    var tpl = await loadServiceTemplate();
    var settings = await loadSettings();
    var payload = {
      version: 5,
      exportDate: new Date().toISOString(),
      appName: "Church Music Planner",
      entryCount: entries.length,
      teamCount: team.length,
      customSongCount: customs.length,
      planCount: plans.length,
      data: entries,
      teamMembers: team,
      customSongs: customs,
      servicePlans: plans,
      serviceTemplate: tpl,
      appSettings: settings
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    var dateStr = new Date().toISOString().split("T")[0];
    a.download = "church-music-planner-backup-" + dateStr + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showImportStatus("success", "Backup exported (" + entries.length + " songs, " + customs.length + " custom, " + team.length + " team, " + plans.length + " plans)");
  } catch(err) {
    showImportStatus("error", "Export failed: " + err.message);
  }
}

async function importData(file) {
  try {
    var text = await file.text();
    var payload = JSON.parse(text);

    // Validate structure
    if (!payload.data || !Array.isArray(payload.data)) {
      showImportStatus("error", "Invalid backup file format.");
      return;
    }

    // Check each entry has an id
    var valid = payload.data.filter(function(d) { return d.id; });
    var teamValid = (payload.teamMembers || []).filter(function(d) { return d.id; });
    var customValid = (payload.customSongs || []).filter(function(d) { return d.id; });

    if (valid.length === 0 && teamValid.length === 0 && customValid.length === 0) {
      showImportStatus("error", "No valid data found in file.");
      return;
    }

    // Confirm before overwriting
    var msg = "Import from backup?\n\nFile: " + file.name + "\n";
    if (payload.exportDate) msg += "Exported: " + formatDate(payload.exportDate.split("T")[0]) + "\n";
    msg += "\n" + valid.length + " song records";
    if (customValid.length) msg += "\n" + customValid.length + " custom songs";
    if (teamValid.length) msg += "\n" + teamValid.length + " team members";
    msg += "\n\nThis will merge with your existing data.";

    if (!confirm(msg)) return;

    var db = await openDB();

    // Write song data
    if (valid.length) {
      var tx = db.transaction(STORE_NAME, "readwrite");
      var store = tx.objectStore(STORE_NAME);
      valid.forEach(function(entry) { store.put(entry); });
      await new Promise(function(resolve, reject) {
        tx.oncomplete = resolve;
        tx.onerror = function() { reject(tx.error); };
      });
    }

    // Write team data
    if (teamValid.length) {
      var tx2 = db.transaction(TEAM_STORE, "readwrite");
      var store2 = tx2.objectStore(TEAM_STORE);
      teamValid.forEach(function(entry) { store2.put(entry); });
      await new Promise(function(resolve, reject) {
        tx2.oncomplete = resolve;
        tx2.onerror = function() { reject(tx2.error); };
      });
    }

    // Write custom songs
    if (customValid.length) {
      var tx3 = db.transaction(CUSTOM_SONG_STORE, "readwrite");
      var store3 = tx3.objectStore(CUSTOM_SONG_STORE);
      customValid.forEach(function(entry) { store3.put(entry); });
      await new Promise(function(resolve, reject) {
        tx3.oncomplete = resolve;
        tx3.onerror = function() { reject(tx3.error); };
      });
    }

    // Write service plans
    var plansValid = (payload.servicePlans || []).filter(function(d) { return d.date; });
    if (plansValid.length) {
      var tx4 = db.transaction(PLAN_STORE, "readwrite");
      var store4 = tx4.objectStore(PLAN_STORE);
      plansValid.forEach(function(entry) { store4.put(entry); });
      await new Promise(function(resolve, reject) {
        tx4.oncomplete = resolve;
        tx4.onerror = function() { reject(tx4.error); };
      });
    }

    // Write service template
    if (payload.serviceTemplate && Array.isArray(payload.serviceTemplate)) {
      var tx5 = db.transaction(TEMPLATE_STORE, "readwrite");
      var store5 = tx5.objectStore(TEMPLATE_STORE);
      store5.put({ id: "default", items: payload.serviceTemplate });
      await new Promise(function(resolve, reject) {
        tx5.oncomplete = resolve;
        tx5.onerror = function() { reject(tx5.error); };
      });
    }

    // Write app settings
    if (payload.appSettings && payload.appSettings.id) {
      var tx6 = db.transaction(SETTINGS_STORE, "readwrite");
      var store6 = tx6.objectStore(SETTINGS_STORE);
      store6.put(payload.appSettings);
      await new Promise(function(resolve, reject) {
        tx6.oncomplete = resolve;
        tx6.onerror = function() { reject(tx6.error); };
      });
    }

    // Reload everything
    var userData = await loadAllUserData();
    customSongsRaw = await loadCustomSongs();
    songs = mergeSongs(getHymnalSongs(), userData).concat(customSongsRaw.map(customToSong));
    teamMembers = await loadTeamMembers();
    serviceTemplate = await loadServiceTemplate();
    appSettings = await loadSettings();
    currentPlan = await loadServicePlan(planDate || getNextSunday());
    var parts = [];
    if (valid.length) parts.push(valid.length + " songs");
    if (customValid.length) parts.push(customValid.length + " custom");
    if (teamValid.length) parts.push(teamValid.length + " team");
    if (plansValid.length) parts.push(plansValid.length + " plans");
    showImportStatus("success", "Imported " + parts.join(", ") + "!");
    render();
  } catch(err) {
    showImportStatus("error", "Import failed: " + err.message);
  }
}

function showImportStatus(type, msg) {
  importStatus = { type: type, msg: msg };
  render();
  clearTimeout(importTimer);
  importTimer = setTimeout(function() { importStatus = null; render(); }, 5000);
}

// ============================================================
// INIT
// ============================================================
async function init() {
  render();
  var userData = await loadAllUserData();
  customSongsRaw = await loadCustomSongs();
  songs = mergeSongs(getHymnalSongs(), userData).concat(customSongsRaw.map(customToSong));
  teamMembers = await loadTeamMembers();
  serviceTemplate = await loadServiceTemplate();
  appSettings = await loadSettings();
  planDate = getNextSunday();
  currentPlan = await loadServicePlan(planDate);
  loaded = true;
  render();
}

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(function(e){console.log("SW reg failed:",e);});
}

init();

</script>
